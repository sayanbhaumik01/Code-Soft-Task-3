<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <!-- Tailwind CSS CDN for modern responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-indigo-600">Expense Tracker</h1>
            <p class="text-sm text-gray-500 mt-1">Monitor your income and expenses effortlessly</p>
        </header>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                <span class="text-sm font-medium text-gray-500">Total Income</span>
                <span id="total-income" class="text-2xl font-bold text-emerald-600 mt-2">₹0.00</span>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                <span class="text-sm font-medium text-gray-500">Total Expenses</span>
                <span id="total-expense" class="text-2xl font-bold text-rose-600 mt-2">₹0.00</span>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                <span class="text-sm font-medium text-gray-500">Current Balance</span>
                <span id="net-balance" class="text-2xl font-bold text-indigo-600 mt-2">₹0.00</span>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Transaction Form -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 md:col-span-1 h-fit">
                <h2 id="form-title" class="text-lg font-semibold text-gray-700 mb-4">Add Transaction</h2>
                <form id="transaction-form" class="space-y-4">
                    <input type="hidden" id="edit-index" value="-1">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Type</label>
                        <select id="type" class="w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Description</label>
                        <input type="text" id="description" required placeholder="e.g., Salary, Groceries" class="w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Amount ($)</label>
                        <input type="number" id="amount" step="0.01" required placeholder="0.00" class="w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Category</label>
                        <select id="category" class="w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <!-- Populated dynamically based on type -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Date</label>
                        <input type="date" id="date" required class="w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white font-medium py-2.5 rounded-lg hover:bg-indigo-700 transition duration-200">Add Transaction</button>
                    <button type="button" id="cancel-btn" onclick="resetForm()" class="w-full bg-gray-200 text-gray-700 font-medium py-2.5 rounded-lg hover:bg-gray-300 transition duration-200 hidden">Cancel Edit</button>
                </form>
            </div>

            <!-- Transaction History & Filtering -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 md:col-span-2 flex flex-col">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-3">
                    <h2 class="text-lg font-semibold text-gray-700">Transaction History</h2>
                    <!-- Category Filter -->
                    <div class="w-full sm:w-auto">
                        <select id="filter-category" onchange="renderApp()" class="w-full sm:w-48 rounded-lg border border-gray-300 p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="All">All Categories</option>
                            <option value="Salary">Salary</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Investments">Investments</option>
                            <option value="Food & Dining">Food & Dining</option>
                            <option value="Housing">Housing</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <!-- History List -->
                <div class="overflow-y-auto max-h-[450px] flex-1 divide-y divide-gray-100" id="transaction-list">
                    <!-- Dynamic Items Go Here -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // Categories definition
        const categories = {
            income: ["Salary", "Freelance", "Investments", "Other"],
            expense: ["Food & Dining", "Housing", "Transportation", "Entertainment", "Utilities", "Other"]
        };

        // Initialize state from Local Storage
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        const typeSelect = document.getElementById('type');
        const categorySelect = document.getElementById('category');
        const form = document.getElementById('transaction-form');

        // Update categories dropdown dynamically when type changes
        function updateCategoryOptions() {
            const selectedType = typeSelect.value;
            categorySelect.innerHTML = '';
            categories[selectedType].forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                categorySelect.appendChild(option);
            });
        }

        typeSelect.addEventListener('change', updateCategoryOptions);
        
        // Set default date to today
        document.getElementById('date').valueAsDate = new Date();
        updateCategoryOptions();

        // Handle Form Submission (Add or Edit)
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const editIndex = parseInt(document.getElementById('edit-index').value);
            const transaction = {
                type: typeSelect.value,
                description: document.getElementById('description').value,
                amount: parseFloat(document.getElementById('amount').value),
                category: categorySelect.value,
                date: document.getElementById('date').value
            };

            if (editIndex === -1) {
                transactions.push(transaction);
            } else {
                transactions[editIndex] = transaction;
                resetForm();
            }

            saveAndRefresh();
            form.reset();
            document.getElementById('date').valueAsDate = new Date();
            updateCategoryOptions();
        });

        // Save to Local Storage and re-render app UI
        function saveAndRefresh() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
            renderApp();
        }

        // Render Summary Cards and Transaction List
        function renderApp() {
            const listContainer = document.getElementById('transaction-list');
            const filterCategory = document.getElementById('filter-category').value;
            
            listContainer.innerHTML = '';

            let totalIncome = 0;
            let totalExpense = 0;

            // Filter transactions
            const filteredTransactions = transactions.filter(t => {
                if (filterCategory === 'All') return true;
                return t.category === filterCategory;
            });

            if (filteredTransactions.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-gray-400 py-8 text-sm">No transactions found.</p>`;
            }

            filteredTransactions.forEach((t, filteredIdx) => {
                // Find actual index in original array for editing/deleting
                const actualIdx = transactions.indexOf(t);

                if (t.type === 'income') {
                    totalIncome += t.amount;
                } else {
                    totalExpense += t.amount;
                }

                const item = document.createElement('div');
                item.className = "py-3 flex items-center justify-between hover:bg-gray-50 px-2 rounded-lg transition";
                
                const amountClass = t.type === 'income' ? 'text-emerald-600' : 'text-rose-600';
                const sign = t.type === 'income' ? '+' : '-';

                item.innerHTML = `
                    <div class="flex flex-col">
                        <span class="font-medium text-sm text-gray-800">${escapeHtml(t.description)}</span>
                        <div class="flex items-center space-x-2 mt-0.5">
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">₹{t.category}</span>
                            <span class="text-xs text-gray-400">${t.date}</span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span class="font-bold text-sm ${amountClass}">${sign}₹${t.amount.toFixed(2)}</span>
                        <div class="flex items-center space-x-1">
                            <button onclick="editTransaction(${actualIdx})" class="p-1 text-gray-400 hover:text-indigo-600 transition" title="Edit">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            </button>
                            <button onclick="deleteTransaction(${actualIdx})" class="p-1 text-gray-400 hover:text-rose-600 transition" title="Delete">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
                listContainer.appendChild(item);
            });

            // Update Summary Cards
            const netBalance = totalIncome - totalExpense;
            document.getElementById('total-income').textContent = `₹${totalIncome.toFixed(2)}`;
            document.getElementById('total-expense').textContent = `₹${totalExpense.toFixed(2)}`;
            
            const netBalanceEl = document.getElementById('net-balance');
            netBalanceEl.textContent = `₹${netBalance.toFixed(2)}`;
            netBalanceEl.className = `text-2xl font-bold mt-2 ${netBalance >= 0 ? 'text-indigo-600' : 'text-rose-600'}`;
        }

        // Edit Transaction Setup
        function editTransaction(index) {
            const t = transactions[index];
            typeSelect.value = t.type;
            updateCategoryOptions();
            document.getElementById('description').value = t.description;
            document.getElementById('amount').value = t.amount;
            categorySelect.value = t.category;
            document.getElementById('date').value = t.date;
            
            document.getElementById('edit-index').value = index;
            document.getElementById('form-title').textContent = "Edit Transaction";
            document.getElementById('submit-btn').textContent = "Update Transaction";
            document.getElementById('cancel-btn').classList.remove('hidden');
        }

        // Reset Form to Add Mode
        function resetForm() {
            form.reset();
            document.getElementById('edit-index').value = "-1";
            document.getElementById('form-title').textContent = "Add Transaction";
            document.getElementById('submit-btn').textContent = "Add Transaction";
            document.getElementById('cancel-btn').classList.add('hidden');
            document.getElementById('date').valueAsDate = new Date();
            updateCategoryOptions();
        }

        // Delete Transaction
        function deleteTransaction(index) {
            if (confirm("Are you sure you want to delete this transaction?")) {
                transactions.splice(index, 1);
                saveAndRefresh();
            }
        }

        // Security helper to prevent XSS injection
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initial application load
        renderApp();
    </script>
</body>
</html>
